name: RC6 Vulkan Static Validation

on:
  push:
    branches: [xray-rc6-vulkan-x64]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc6-vulkan-static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Linux materialization and invariant validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout integration repo
        uses: actions/checkout@v4

      - name: Test sparse release staging policy
        shell: bash
        run: |
          set -euo pipefail
          python tools/test_release_staging_policy.py

      - name: Validate pinned OpenAL overlay policy
        shell: bash
        run: |
          set -euo pipefail
          port='tools/vcpkg-overlay/ports/openal-soft/portfile.cmake'
          triplet='tools/vcpkg-overlay/triplets/xray-openal-static-crt.cmake'
          test -s "$port"
          test -s "$triplet"
          grep -Fq 'REF 1.25.1' "$port"
          grep -Fq -- '-DFORCE_STATIC_VCRT=ON' "$port"
          grep -Fq -- '-DLIBTYPE=SHARED' "$port"
          grep -Fq 'set(VCPKG_CRT_LINKAGE static)' "$triplet"
          grep -Fq 'set(VCPKG_LIBRARY_LINKAGE dynamic)' "$triplet"
          grep -Fq "e8a82dfad0c4a0dab656f350aa33dc8cef3e92ee" patches/rc6-vcpkg-baseline-fix.patch
          if grep -Fq '"fmt"' tools/vcpkg-overlay/ports/openal-soft/vcpkg.json; then
            echo 'RC6 OpenAL overlay must use bundled fmt, not a dynamic vcpkg fmt dependency.' >&2
            exit 1
          fi

      - name: Reconstruct and verify RC6 patch
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t parts < <(find patches -maxdepth 1 -type f -name 'rc6_ci_bin.part*' | sort)
          if [ "${#parts[@]}" -ne 11 ]; then
            echo "Expected 11 RC6 binary patch chunks, found ${#parts[@]}." >&2
            exit 1
          fi
          cat "${parts[@]}" > "$RUNNER_TEMP/RC6_CI_COMPACT.patch.xz"
          actual="$(sha256sum "$RUNNER_TEMP/RC6_CI_COMPACT.patch.xz" | awk '{print $1}')"
          expected='a249841b89a5cdc0696fd45ad21793345aec69c0eab72bfb7c1391668d93e482'
          if [ "$actual" != "$expected" ]; then
            echo "RC6 patch archive hash mismatch: $actual" >&2
            exit 1
          fi
          xz -dc "$RUNNER_TEMP/RC6_CI_COMPACT.patch.xz" > "$RUNNER_TEMP/RC6_CI_COMPACT.patch"
          test -s "$RUNNER_TEMP/RC6_CI_COMPACT.patch"
          echo "RC6_PATCH=$RUNNER_TEMP/RC6_CI_COMPACT.patch" >> "$GITHUB_ENV"

      - name: Clone pinned upstream source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/Mawrak/S.T.A.L.K.E.R.-SHOC-VS2019.git source
          git -C source checkout ac3c009a3ecea26b60f16468993e7c540d063acf

      - name: Materialize current RC6 x64 Vulkan renderer
        shell: bash
        run: |
          set -euo pipefail
          cp -a source/xr_3da/xrRender_R2 source/xr_3da/xrRender_VK
          git -C source apply --check "$RC6_PATCH"
          git -C source apply "$RC6_PATCH"

          for patch in patches/rc6-vcpkg-manifest-fix.patch patches/rc6-vcpkg-baseline-fix.patch; do
            git -C source apply --check "$GITHUB_WORKSPACE/$patch"
            git -C source apply "$GITHUB_WORKSPACE/$patch"
          done

          python tools/fix_x64_item_metadata.py source
          python tools/fix_legacy_stl.py source
          python tools/fix_x64_abi.py source
          python tools/fix_x64_runtime_compat.py source

      - name: Validate Vulkan frame and resource invariants
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_vulkan_extensions.py source
          python tools/validate_vulkan_frame_path.py source
          python tools/validate_vulkan_geometry_bridge.py source
          python tools/validate_vulkan_stream_mirror.py source
          python tools/validate_vulkan_stream_lifetime.py source
          python tools/validate_vulkan_indexed_draw.py source
          python tools/validate_vulkan_material_descriptors.py source
          python tools/validate_vulkan_texture_bridge.py source
          python tools/validate_vulkan_uniform_stream.py source
          python tools/validate_vulkan_transactional_swapchain.py source

      - name: Verify materialized renderer contract
        shell: bash
        run: |
          set -euo pipefail
          vk='source/xr_3da/xrRender_VK/vk_bootstrap.cpp'
          test -s "$vk"
          grep -Fq 'vkCreateWin32SurfaceKHR' "$vk"
          grep -Fq 'vkCreateSwapchainKHR' "$vk"
          grep -Fq 'vkCreateGraphicsPipelines' "$vk"
          grep -Fq 'vkCmdDrawIndexed' "$vk"
          grep -Fq 'vkCmdCopyBufferToImage' "$vk"
          grep -Fq 'xr_vk_max_mip_levels' "$vk"
          grep -Fq 'xr_vk_mip_extent(texture, mip_level, mip_width, mip_height)' "$vk"
          grep -Fq 'xr_vk_texture_block_info' "$vk"
          grep -Fq 'staging_offset % block_bytes' "$vk"
          grep -Fq 'xr_vk_allocate_texture_material' "$vk"
          grep -Fq 'xr_vk_deferred_texture_queue' "$vk"
          grep -Fq 'xr_vk_release_texture_material' "$vk"
          grep -Fq 'xr_vk_collect_deferred_textures();' "$vk"
          grep -Fq 'xr_vk_restore_signaled_frame_fence' "$vk"
          grep -Fq 'presented != VK_SUCCESS && presented != VK_SUBOPTIMAL_KHR' "$vk"
          grep -Fq 'bool xr_vk_recreate_swapchain_from_window()' "$vk"
          grep -Fq 'GetClientRect(g_window_handle, &client)' "$vk"
          grep -Fq 'presented == VK_ERROR_OUT_OF_DATE_KHR' "$vk"
          grep -Fq 'presented == VK_SUBOPTIMAL_KHR || acquire == VK_SUBOPTIMAL_KHR' "$vk"
          grep -Fq 'xr_vk_uniform_stream' "$vk"
          grep -Fq 'xr_vk_bootstrap_frame' "$vk"
          grep -Fq 'g_frame_submission_pending' "$vk"
          grep -Fq 'xr_vk_create_buffer(67108864ull' "$vk"
          grep -Fq 'void xr_vk_destroy_swapchain_resources()' "$vk"
          grep -Fq 'g_descriptor_pool == VK_NULL_HANDLE' "$vk"
          grep -Fq 'g_uniform_buffer == VK_NULL_HANDLE' "$vk"
          grep -Fq 'info.oldSwapchain = old_swapchain;' "$vk"
          grep -Fq 'bool xr_vk_transactional_recreate_swapchain(unsigned width, unsigned height)' "$vk"
          grep -Fq 'xr_vk_restore_swapchain_state(old_state);' "$vk"
          grep -Fq 'xr_vk_restore_swapchain_state(new_state);' "$vk"

          python - <<'PY'
          from pathlib import Path
          text = Path('source/xr_3da/xrRender_VK/vk_bootstrap.cpp').read_text(encoding='utf-8')
          start = text.index('bool xr_vk_bootstrap_frame()')
          end = text.index('bool xr_vk_bootstrap_runtime_ready()', start)
          frame = text[start:end]
          wait_fence = frame.index('g_vkWaitForFences')
          collect_textures = frame.index('xr_vk_collect_deferred_textures()', wait_fence)
          reset_cmd = frame.index('g_vkResetCommandBuffer')
          reset_fence = frame.index('g_vkResetFences')
          submit = frame.index('g_vkQueueSubmit')
          if not wait_fence < collect_textures < reset_cmd < reset_fence < submit:
              raise SystemExit('Unsafe Vulkan fence/texture-release/submit order')
          present = frame.index('VkResult presented = g_vkQueuePresentKHR')
          guard = frame.index('presented != VK_SUCCESS && presented != VK_SUBOPTIMAL_KHR', present)
          commit = frame.index('g_image_initialized[image_index] = 1', present)
          if not present < guard < commit:
              raise SystemExit('Unsafe swapchain image state commit order')
          acquire_ood = frame.index('acquire == VK_ERROR_OUT_OF_DATE_KHR')
          acquire_recreate = frame.index('xr_vk_recreate_swapchain_from_window()', acquire_ood)
          present_ood = frame.index('presented == VK_ERROR_OUT_OF_DATE_KHR')
          present_recreate = frame.index('xr_vk_recreate_swapchain_from_window()', present_ood)
          if not acquire_ood < acquire_recreate < present_ood < present_recreate:
              raise SystemExit('Swapchain OUT_OF_DATE recreation path is incomplete')

          resize_start = text.index('bool xr_vk_bootstrap_resize(unsigned width, unsigned height)')
          frame_start = text.index('bool xr_vk_bootstrap_frame()', resize_start)
          resize_and_recreate = text[resize_start:frame_start]
          zero_guard = resize_and_recreate.index('if (!width || !height)')
          transaction = resize_and_recreate.index('xr_vk_transactional_recreate_swapchain(width, height)')
          if not zero_guard < transaction:
              raise SystemExit('Minimized zero-extent swapchain recreation is attempted prematurely')
          if resize_and_recreate.count('xr_vk_transactional_recreate_swapchain(width, height)') < 2:
              raise SystemExit('Not all resize paths use transactional swapchain recreation')
          if 'xr_vk_destroy_frame_resources();' in resize_and_recreate:
              raise SystemExit('Resize invalidates persistent Vulkan material/device resources')
          if 'xr_vk_destroy_swapchain_resources();\n    return xr_vk_create_swapchain(width, height);' in resize_and_recreate:
              raise SystemExit('Legacy destructive swapchain recreation path remains')

          partial_start = text.index('void xr_vk_destroy_swapchain_resources()')
          full_start = text.index('void xr_vk_destroy_frame_resources()', partial_start)
          partial = text[partial_start:full_start]
          for forbidden in (
              'g_vkDestroyDescriptorPool', 'g_vkDestroyDescriptorSetLayout', 'g_vkDestroyPipelineLayout',
              'g_vkDestroyPipelineCache', 'g_vkDestroySampler', 'g_uniform_buffer', 'g_upload_buffer',
              'g_stream_vertex_buffer', 'g_stream_index_buffer'):
              if forbidden in partial:
                  raise SystemExit(f'Swapchain teardown incorrectly owns persistent resource: {forbidden}')

          tx_start = text.index('bool xr_vk_transactional_recreate_swapchain(unsigned width, unsigned height)')
          tx_end = resize_start
          tx = text[tx_start:tx_end]
          create_new = tx.index('xr_vk_create_swapchain(width, height, old_state.swapchain)')
          rollback = tx.index('xr_vk_restore_swapchain_state(old_state);', create_new)
          capture_new = tx.index('new_state = xr_vk_capture_swapchain_state()', rollback)
          destroy_old = tx.index('xr_vk_destroy_swapchain_resources();', capture_new)
          restore_new = tx.index('xr_vk_restore_swapchain_state(new_state);', destroy_old)
          if not create_new < rollback < capture_new < destroy_old < restore_new:
              raise SystemExit('Transactional swapchain rollback/commit ordering is unsafe')

          destroy_start = full_start
          destroy_end = text.index('void xr_vk_destroy_window_runtime()', destroy_start)
          destroy_frame = text[destroy_start:destroy_end]
          idle = destroy_frame.index('g_vkDeviceWaitIdle')
          collect_shutdown = destroy_frame.index('xr_vk_collect_deferred_textures()', idle)
          if not idle < collect_shutdown:
              raise SystemExit('Deferred textures are not collected after device idle during shutdown')
          PY

          echo 'Static RC6 Vulkan materialization contract passed.'

      - name: Upload materialization diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rc6-vulkan-static-diagnostics
          path: |
            source/xr_3da/xrRender_VK/vk_bootstrap.cpp
            source/xr_3da/xrRender_VK/vk_bootstrap.h
          if-no-files-found: ignore
          retention-days: 7
