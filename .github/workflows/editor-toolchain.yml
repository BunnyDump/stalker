name: Editor test toolchain
on:
  push:
    branches: ['codex/ui-layout-editor-20260915']
    paths: ['.github/workflows/editor-toolchain.yml']
permissions:
  contents: read
jobs:
  toolchain:
    runs-on: ubuntu-24.04
    steps:
      - name: Prepare compiler for local corpus validation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mono-mcs libmono-system-windows-forms4.0-cil libgdiplus xvfb libmono-i18n-other4.0-cil libmono-i18n-rare4.0-cil
          mkdir -p output
          tar -czf output/editor-test-toolchain.tar.gz /usr/bin/mono-sgen /usr/lib/mono /etc/mono /usr/lib/libmono* /usr/lib/libgdiplus* /usr/lib/x86_64-linux-gnu/libexif* /usr/lib/x86_64-linux-gnu/libXfont2* /usr/bin/Xvfb /usr/bin/xkbcomp /usr/share/X11/xkb
      - uses: actions/upload-artifact@v4
        with:
          name: editor-test-toolchain
          path: output/editor-test-toolchain.tar.gz
          retention-days: 2
