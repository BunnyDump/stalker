name: RC6 Vulkan Resource Formats Materialize

on:
  push:
    branches: [xray-rc6-vulkan-resource-formats]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc6-vulkan-resource-formats-materialize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct RC6 patch
        shell: bash
        run: |
          set -euo pipefail
          cat patches/rc6_ci_bin.part* > /tmp/RC6.patch.xz
          echo 'a249841b89a5cdc0696fd45ad21793345aec69c0eab72bfb7c1391668d93e482  /tmp/RC6.patch.xz' | sha256sum -c -
          xz -dc /tmp/RC6.patch.xz > /tmp/RC6.patch
      - name: Clone pinned upstream
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/Mawrak/S.T.A.L.K.E.R.-SHOC-VS2019.git source
          git -C source checkout ac3c009a3ecea26b60f16468993e7c540d063acf
          cp -a source/xr_3da/xrRender_R2 source/xr_3da/xrRender_VK
          git -C source apply --check /tmp/RC6.patch
          git -C source apply /tmp/RC6.patch
          git -C source apply "$GITHUB_WORKSPACE/patches/rc6-vcpkg-manifest-fix.patch"
          git -C source apply "$GITHUB_WORKSPACE/patches/rc6-vcpkg-baseline-fix.patch"
      - name: Materialize complete Vulkan chain
        shell: bash
        run: |
          set -euo pipefail
          python tools/fix_x64_item_metadata.py source
          python tools/fix_legacy_stl.py source
          python tools/fix_x64_abi.py source
          python tools/fix_x64_runtime_compat.py source
      - name: Validate generic resource formats
        shell: bash
        run: |
          set -euo pipefail
          H=source/xr_3da/xrRender_VK/vk_bootstrap.h
          C=source/xr_3da/xrRender_VK/vk_bootstrap.cpp
          grep -F 'enum XrVkTextureFormat' "$H"
          grep -F 'XR_VK_TEXTURE_RGBA8_SNORM' "$H"
          grep -F 'XR_VK_TEXTURE_RG8_UNORM' "$H"
          grep -F 'VK_IMAGE_TYPE_3D' "$C"
          grep -F 'VK_IMAGE_VIEW_TYPE_3D' "$C"
          grep -F 'copy.imageExtent.depth = depth' "$C"
          grep -F 'vkGetPhysicalDeviceFormatProperties' "$C"
          grep -F 'xr_vk_texture_create(const void* pixels' "$C"
          python tools/audit_vulkan_renderer.py source --json resource-formats-audit.json --top 100
      - name: Upload materialization audit
        uses: actions/upload-artifact@v4
        with:
          name: RC6_VULKAN_RESOURCE_FORMATS_MATERIALIZE
          path: resource-formats-audit.json
          if-no-files-found: error
