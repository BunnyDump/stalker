name: RC6 Vulkan Render Build

on:
  push:
    branches: [xray-rc6-vulkan-render-infra]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc6-vulkan-render-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct RC6 patch
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $parts=Get-ChildItem "$env:GITHUB_WORKSPACE\patches\rc6_ci_bin.part*"|Sort-Object Name
          if($parts.Count -ne 11){throw "Expected 11 chunks, found $($parts.Count)."}
          $xz=Join-Path $env:RUNNER_TEMP 'RC6.patch.xz';$s=[IO.File]::Create($xz)
          try{foreach($p in $parts){$b=[IO.File]::ReadAllBytes($p.FullName);$s.Write($b,0,$b.Length)}}finally{$s.Dispose()}
          if((Get-FileHash $xz -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'a249841b89a5cdc0696fd45ad21793345aec69c0eab72bfb7c1391668d93e482'){throw 'RC6 patch hash mismatch.'}
          $out=Join-Path $env:RUNNER_TEMP 'patch';New-Item -ItemType Directory -Force $out|Out-Null
          & "$env:ProgramFiles\7-Zip\7z.exe" e -y "-o$out" $xz|Out-Host
          $patch=Get-ChildItem $out -Filter '*.patch'|Select-Object -First 1
          if(-not $patch){throw 'RC6 patch missing.'}
          "RC6_PATCH=$($patch.FullName)"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Clone and materialize
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git clone https://github.com/Mawrak/S.T.A.L.K.E.R.-SHOC-VS2019.git source
          git -C source checkout ac3c009a3ecea26b60f16468993e7c540d063acf
          Copy-Item -Recurse -Force "$env:GITHUB_WORKSPACE\source\xr_3da\xrRender_R2" "$env:GITHUB_WORKSPACE\source\xr_3da\xrRender_VK"
          git -C source apply "$env:RC6_PATCH"
          git -C source apply "$env:GITHUB_WORKSPACE\patches\rc6-vcpkg-manifest-fix.patch"
          git -C source apply "$env:GITHUB_WORKSPACE\patches\rc6-vcpkg-baseline-fix.patch"
          python "$env:GITHUB_WORKSPACE\tools\fix_x64_item_metadata.py" source
          python "$env:GITHUB_WORKSPACE\tools\fix_legacy_stl.py" source
          python "$env:GITHUB_WORKSPACE\tools\fix_x64_abi.py" source
          python "$env:GITHUB_WORKSPACE\tools\fix_x64_runtime_compat.py" source
          if($LASTEXITCODE -ne 0){throw 'Materialization failed.'}
          $utf8Bom=[Text.UTF8Encoding]::new($true)
          Get-ChildItem source -Filter '*.ps1' -File|ForEach-Object{$t=[IO.File]::ReadAllText($_.FullName,[Text.UTF8Encoding]::new($false));[IO.File]::WriteAllText($_.FullName,$t,$utf8Bom)}
      - name: Restore DirectX SDK cache
        id: dxsdk
        uses: actions/cache/restore@v4
        with:
          path: C:\Program Files (x86)\Microsoft DirectX SDK (June 2010)
          key: dxsdk-jun2010-v1
      - name: Install DirectX SDK
        if: steps.dxsdk.outputs.cache-hit != 'true'
        shell: pwsh
        run: choco install directx-sdk --yes --no-progress
      - name: Configure build
        shell: pwsh
        run: |
          $dx='C:\Program Files (x86)\Microsoft DirectX SDK (June 2010)\';if(-not(Test-Path (Join-Path $dx 'Include\d3d9.h'))){throw 'DXSDK missing.'};"DXSDK_DIR=$dx"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $v=$env:VCPKG_INSTALLATION_ROOT;if(-not $v){$v='C:\vcpkg'};"VCPKG_ROOT=$v"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/cache/restore@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: rc6-vcpkg-${{ runner.os }}-x64-${{ hashFiles('patches/rc6-vcpkg-*.patch') }}
          restore-keys: rc6-vcpkg-${{ runner.os }}-x64-
      - name: Build x64 render infrastructure
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference='Continue';$log=Join-Path $PWD 'render-infra-build.log'
          & cmd.exe /d /c 'BUILD_RC6_X64_VULKAN_RELEASE.bat' 2>&1|Tee-Object -FilePath $log
          $exit=$LASTEXITCODE
          if($exit -ne 0){$m=Select-String -Path $log -Pattern '(?i)fatal error C\d{4}|(?i)\berror C\d{4}\b|(?i)\berror LNK\d{4}\b|(?i)\berror MSB\d{4}\b'|Select-Object -First 1;if($m){Write-Host "::error title=First render-infra compiler error::$($m.Line)";Write-Host "FIRST_RENDER_INFRA_ERROR: $($m.Line)"};exit $exit}
      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: STALKER_SHOC_RC6_X64_VULKAN_RENDER_INFRA
          path: source/READY_RC6_X64_VULKAN
          if-no-files-found: error
          compression-level: 9
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rc6-vulkan-render-build-diagnostics
          path: source/render-infra-build.log
          if-no-files-found: ignore
          retention-days: 7
