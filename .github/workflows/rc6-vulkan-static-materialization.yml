name: RC6 Vulkan Static Materialization

on:
  push:
    branches: [xray-rc6-vulkan-rendertarget-depthstate]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  materialize:
    name: Linux static Vulkan materialization
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout integration repo
        uses: actions/checkout@v4

      - name: Reconstruct RC6 patch
        shell: bash
        run: |
          set -euo pipefail
          cat patches/rc6_ci_bin.part* > "$RUNNER_TEMP/RC6.patch.xz"
          echo 'a249841b89a5cdc0696fd45ad21793345aec69c0eab72bfb7c1391668d93e482  '"$RUNNER_TEMP/RC6.patch.xz" | sha256sum -c -
          xz -dc "$RUNNER_TEMP/RC6.patch.xz" > "$RUNNER_TEMP/RC6.patch"

      - name: Clone pinned upstream
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/Mawrak/S.T.A.L.K.E.R.-SHOC-VS2019.git source
          git -C source checkout ac3c009a3ecea26b60f16468993e7c540d063acf
          cp -a source/xr_3da/xrRender_R2 source/xr_3da/xrRender_VK

      - name: Apply RC6 integration patch
        shell: bash
        run: |
          set -euo pipefail
          git -C source apply --check "$RUNNER_TEMP/RC6.patch"
          git -C source apply "$RUNNER_TEMP/RC6.patch"
          git -C source apply "$GITHUB_WORKSPACE/patches/rc6-vcpkg-manifest-fix.patch"
          git -C source apply "$GITHUB_WORKSPACE/patches/rc6-vcpkg-baseline-fix.patch"

      - name: Run renderer-independent transforms
        shell: bash
        run: |
          set -euo pipefail
          python tools/fix_x64_item_metadata.py source
          python tools/fix_legacy_stl.py source
          python tools/fix_x64_abi.py source
          python tools/fix_x64_runtime_compat.py source

      - name: Validate render-target decoupling
        shell: bash
        run: |
          set -euo pipefail
          rt='source/xr_3da/xrRender_VK/r2_rendertarget.cpp'
          grep -q 'enum XrRtFormat' "$rt"
          grep -q 'enum XrPrimitiveTopology' "$rt"
          grep -q 'enum XrCompareOp' "$rt"
          grep -q 'enum XrSampleMode' "$rt"
          grep -q 'xr_compare_legacy(XR_COMPARE_LESS_EQUAL)' "$rt"
          grep -q 'xr_sample_legacy(XR_SAMPLE_NONE)' "$rt"
          if grep -Eq 'RCache\.Render[[:space:]]*\([[:space:]]*D3DPT_' "$rt"; then
            echo 'Direct D3D primitive topology remains in render calls' >&2
            exit 1
          fi
          if grep -Fq 'RCache.set_Stencil(TRUE, D3DCMP_LESSEQUAL,' "$rt"; then
            echo 'Direct D3D compare remains in stencil call' >&2
            exit 1
          fi
          echo STATIC_MATERIALIZATION_OK
