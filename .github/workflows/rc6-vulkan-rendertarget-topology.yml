name: RC6 Vulkan RenderTarget Topology

on:
  push:
    branches: [xray-rc6-vulkan-rendertarget-topology]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rc6-vulkan-rendertarget-topology-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64 Vulkan RenderTarget Topology
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout integration repo
        uses: actions/checkout@v4

      - name: Reconstruct RC6 patch
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $parts=Get-ChildItem "$env:GITHUB_WORKSPACE\patches\rc6_ci_bin.part*" | Sort-Object Name
          if($parts.Count -ne 11){throw "Expected 11 RC6 chunks, found $($parts.Count)"}
          $xz=Join-Path $env:RUNNER_TEMP 'RC6.patch.xz'
          $stream=[IO.File]::Create($xz)
          try{foreach($part in $parts){$b=[IO.File]::ReadAllBytes($part.FullName);$stream.Write($b,0,$b.Length)}}finally{$stream.Dispose()}
          if((Get-FileHash $xz -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'a249841b89a5cdc0696fd45ad21793345aec69c0eab72bfb7c1391668d93e482'){throw 'RC6 patch hash mismatch'}
          $out=Join-Path $env:RUNNER_TEMP 'rc6_patch';New-Item -Type Directory -Force $out|Out-Null
          & "$env:ProgramFiles\7-Zip\7z.exe" e -y "-o$out" $xz|Out-Host
          if($LASTEXITCODE -ne 0){throw 'Patch unpack failed'}
          $patch=Get-ChildItem $out -Filter '*.patch'|Select-Object -First 1
          "RC6_PATCH=$($patch.FullName)"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Clone pinned upstream
        shell: pwsh
        run: |
          git clone https://github.com/Mawrak/S.T.A.L.K.E.R.-SHOC-VS2019.git source
          git -C source checkout ac3c009a3ecea26b60f16468993e7c540d063acf
          if($LASTEXITCODE -ne 0){throw 'Pinned upstream checkout failed'}

      - name: Materialize Vulkan topology stack
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Copy-Item -Recurse -Force "$env:GITHUB_WORKSPACE\source\xr_3da\xrRender_R2" "$env:GITHUB_WORKSPACE\source\xr_3da\xrRender_VK"
          git -C source apply --check "$env:RC6_PATCH";if($LASTEXITCODE -ne 0){throw 'RC6 patch preflight failed'}
          git -C source apply "$env:RC6_PATCH";if($LASTEXITCODE -ne 0){throw 'RC6 patch failed'}
          foreach($p in @('patches\rc6-vcpkg-manifest-fix.patch','patches\rc6-vcpkg-baseline-fix.patch')){$f=Join-Path $env:GITHUB_WORKSPACE $p;git -C source apply $f;if($LASTEXITCODE -ne 0){throw "Patch failed: $p"}}
          python "$env:GITHUB_WORKSPACE\tools\fix_x64_item_metadata.py" "$env:GITHUB_WORKSPACE\source"
          python "$env:GITHUB_WORKSPACE\tools\fix_legacy_stl.py" "$env:GITHUB_WORKSPACE\source"
          python "$env:GITHUB_WORKSPACE\tools\fix_x64_abi.py" "$env:GITHUB_WORKSPACE\source"
          python "$env:GITHUB_WORKSPACE\tools\fix_x64_runtime_compat.py" "$env:GITHUB_WORKSPACE\source"
          if($LASTEXITCODE -ne 0){throw 'Vulkan topology materialization failed'}
          $rt="$env:GITHUB_WORKSPACE\source\xr_3da\xrRender_VK\r2_rendertarget.cpp"
          foreach($token in @('enum XrRtFormat','enum XrPrimitiveTopology','xr_primitive_legacy_topology')){if(-not(Select-String -Path $rt -SimpleMatch $token -Quiet)){throw "Render-target topology token missing: $token"}}
          if(Select-String -Path $rt -Pattern 'RCache\.Render\s*\(\s*D3DPT_' -Quiet){throw 'Direct D3DPT topology remains in RCache.Render calls'}
          python "$env:GITHUB_WORKSPACE\tools\audit_vulkan_renderer.py" "$env:GITHUB_WORKSPACE\source" --json "$env:GITHUB_WORKSPACE\rendertarget-topology-audit.json" --top 100

      - name: Restore DirectX SDK cache
        id: dxsdk-cache
        uses: actions/cache/restore@v4
        with:
          path: C:\Program Files (x86)\Microsoft DirectX SDK (June 2010)
          key: dxsdk-jun2010-v1

      - name: Install DirectX SDK
        if: steps.dxsdk-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: choco install directx-sdk --yes --no-progress

      - name: Configure dependencies
        shell: pwsh
        run: |
          $dx='C:\Program Files (x86)\Microsoft DirectX SDK (June 2010)\'
          if(-not(Test-Path (Join-Path $dx 'Include\d3d9.h'))){throw 'DXSDK missing'}
          "DXSDK_DIR=$dx"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $v=$env:VCPKG_INSTALLATION_ROOT;if(-not $v){$v='C:\vcpkg'}
          "VCPKG_ROOT=$v"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore vcpkg archives
        uses: actions/cache/restore@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: rc6-vcpkg-${{ runner.os }}-x64-${{ hashFiles('patches/rc6-vcpkg-*.patch') }}
          restore-keys: rc6-vcpkg-${{ runner.os }}-x64-

      - name: Build x64 Vulkan render-target topology
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference='Continue'
          $log=Join-Path $PWD 'rendertarget-topology-build.log'
          & cmd.exe /d /c 'BUILD_RC6_X64_VULKAN_RELEASE.bat' 2>&1|Tee-Object -FilePath $log
          $exit=$LASTEXITCODE
          if($exit -ne 0){$m=Select-String $log -Pattern '(?i)fatal error C\d{4}|(?i)\berror C\d{4}\b|(?i)\berror LNK\d{4}\b|(?i)\berror MSB\d{4}\b'|Select-Object -First 1;if($m){Write-Host "FIRST_VULKAN_RENDERTARGET_TOPOLOGY_ERROR: $($m.Line)"};exit $exit}

      - name: Upload artifact and audit
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: STALKER_SHOC_RC6_X64_VULKAN_RENDERTARGET_TOPOLOGY
          path: |
            READY_RC6_X64_VULKAN
            rendertarget-topology-audit.json
          if-no-files-found: error
          compression-level: 9

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rc6-vulkan-rendertarget-topology-diagnostics
          path: source/rendertarget-topology-build.log
          if-no-files-found: ignore
          retention-days: 7
