name: RC6 Vulkan Render Audit

on:
  push:
    branches: [xray-rc6-vulkan-render-infra]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct patch
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $parts=Get-ChildItem "$env:GITHUB_WORKSPACE\patches\rc6_ci_bin.part*" | Sort-Object Name
          if ($parts.Count -ne 11) { throw "Expected 11 RC6 patch chunks, found $($parts.Count)." }
          $xz=Join-Path $env:RUNNER_TEMP 'RC6.patch.xz'; $s=[IO.File]::Create($xz)
          try { foreach($p in $parts){$b=[IO.File]::ReadAllBytes($p.FullName);$s.Write($b,0,$b.Length)} } finally {$s.Dispose()}
          if ((Get-FileHash $xz -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'a249841b89a5cdc0696fd45ad21793345aec69c0eab72bfb7c1391668d93e482') { throw 'RC6 patch hash mismatch.' }
          $out=Join-Path $env:RUNNER_TEMP 'patch'; New-Item -ItemType Directory -Force $out|Out-Null
          & "$env:ProgramFiles\7-Zip\7z.exe" e -y "-o$out" $xz|Out-Host
          $patch=Get-ChildItem $out -Filter '*.patch'|Select-Object -First 1
          "RC6_PATCH=$($patch.FullName)"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Materialize renderer
        shell: pwsh
        run: |
          git clone --filter=blob:none https://github.com/Mawrak/S.T.A.L.K.E.R.-SHOC-VS2019.git source
          git -C source checkout ac3c009a3ecea26b60f16468993e7c540d063acf
          Copy-Item -Recurse -Force source\xr_3da\xrRender_R2 source\xr_3da\xrRender_VK
          git -C source apply "$env:RC6_PATCH"
          git -C source apply patches\rc6-vcpkg-manifest-fix.patch
          git -C source apply patches\rc6-vcpkg-baseline-fix.patch
          python tools\fix_x64_item_metadata.py source
          python tools\fix_legacy_stl.py source
          python tools\fix_x64_abi.py source
          python tools\fix_x64_runtime_compat.py source
          if ($LASTEXITCODE -ne 0) { throw 'Materialization failed.' }
      - name: Audit Vulkan/D3D coupling
        shell: pwsh
        run: |
          python tools\audit_vulkan_renderer.py source --json vulkan-render-audit.json --top 60
          if ($LASTEXITCODE -ne 0) { throw 'Vulkan audit failed.' }
          Get-Content vulkan-render-audit.json | Out-Host
      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: rc6-vulkan-render-audit
          path: vulkan-render-audit.json
          if-no-files-found: error
